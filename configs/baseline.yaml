# Параметры базового решения. Единицы — метры.
voxel: 0.03              # прореживание облака
outlier_neighbors: 20    # удаление выбросов: соседей для статистики
outlier_std: 2.0         #   и порог в стандартных отклонениях
normal_radius: 0.10      # радиус оценки нормалей
normal_max_nn: 30
poisson_depth: 9         # глубина реконструкции; для сцены ~20 м ячейка ~4 см
density_quantile: 0.03   # доля вершин с наименьшей плотностью, которые удаляются
visual_triangles: 200000
collision_triangles: 20000
